[project]
name = "louisville-open-data-expenditure-bot"
version = "1.0.0"
description = "Lou: an agentic analytics assistant over Louisville Metro open data"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
# Runtime dependencies mirror requirements.txt, which the Docker images still
# install from; keep the two in step until the images move to uv.
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.34,<0.35",
    "openai>=1.82,<3",
    "anthropic>=1.13,<2",
    "duckdb>=1.5.5,<2",
    "pandas>=2.2,<3",
    "pyyaml>=6,<7",
    "requests>=2.31,<3",
]

[dependency-groups]
dev = [
    "pytest",
    "boto3>=1.34,<2",
    "moto[dynamodb,ssm]>=5,<6",
    "aws-cdk-lib>=2.170,<3",
    "constructs>=10,<11",
    "beautifulsoup4>=4.12,<5",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# The classic default set, named explicitly so a ruff upgrade cannot widen it
# (0.17 enables far more by default than 0.15 did).
select = ["E4", "E7", "E9", "F"]
# E402: app.py and two test modules set env/sys.path before importing on
# purpose; E741: single-letter names in the SQL helpers and scrapers. Both
# are style-only and predate ruff; new code should avoid them.
ignore = ["E402", "E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The modules live at the repo root; `uv run pytest` does not add the cwd the
# way `python -m pytest` did.
pythonpath = ["."]
